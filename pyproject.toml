[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "text2sql-agent"
version = "0.3.0"
description = "Безопасный NL→SQL агент: интроспекция схемы, поиск таблиц, self-healing, SELECT-only guardrails."
requires-python = ">=3.10"
dependencies = [
  "psycopg[binary]>=3.1",
  "pandas>=2.0",
  "sqlparse>=0.4.4",
  "requests>=2.31",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
app = ["streamlit>=1.31"]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["text2sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
